name: Agent-W-Trader CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install safety-core dependencies
        run: python -m pip install --upgrade pip pydantic PyYAML pytest
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
